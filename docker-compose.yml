version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: infrawatch-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: infrawatch
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - infrawatch-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: infrawatch-backend
    restart: always
    environment:
      DB_TYPE: postgres
      POSTGRES_SERVER: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: infrawatch
      POSTGRES_PORT: 5432
      SECRET_KEY: "infrawatch-prod-jwt-secret-key"
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    networks:
      - infrawatch-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: infrawatch-frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - infrawatch-net

  prometheus:
    image: prom/prometheus:latest
    container_name: infrawatch-prometheus
    restart: always
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - infrawatch-net

  grafana:
    image: grafana/grafana:latest
    container_name: infrawatch-grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3001:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - infrawatch-net

networks:
  infrawatch-net:
    driver: bridge

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
